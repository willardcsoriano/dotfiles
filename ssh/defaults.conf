# Shared SSH client defaults -- tracked in dotfiles (ssh/defaults.conf).
#
# install.sh copies this to ~/.ssh/config.d/dotfiles-defaults.conf and
# includes it at the END of ~/.ssh/config. ssh uses the first value it finds
# for each option, so anything a Host block in ~/.ssh/config or
# ~/.ssh/config.local sets still wins over these. Rationale for each option:
# ssh-vm-banner-timeout/configs.md, section 3.

Host *
    AddKeysToAgent yes
    ServerAliveInterval 10
    ServerAliveCountMax 3
    # Plain ssh only: VS Code Remote-SSH doesn't follow Include, never sees
    # this file, and passes -o ConnectTimeout from remote.SSH.connectTimeout
    # instead (vscode/settings.json; vscode-ssh-budget prints the result).
    # Fresh logins to dev over lossy mobile data took up to 18.3s
    # (incident-2026-10-14-lossy-link-stalled-master-remote-ssh.md). Cost: a
    # host that silently drops TCP takes up to 30s per ConnectionAttempt.
    ConnectTimeout 30
    ConnectionAttempts 5
    IPQoS 0
    # Shared connections; zombie masters after suspend are cleared by the
    # ssh-control-reset sleep hook, stale sockets by fix-ssh. The path names
    # the user and port as well as the host: with the host alone, ssh v@box
    # reuses an open root@box master and runs as root.
    ControlMaster auto
    ControlPath ~/.ssh/cm-%r@%h:%p
    ControlPersist 2h
