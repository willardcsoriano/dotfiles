# mouse capture at the tmux layer -- without this, scroll wheel events pass
# straight through tmux untouched to whatever app is running (e.g. Claude
# Code's own mouse handling), never reaching tmux's own scrollback at all.
set -g mouse on

# tmux's own default WheelUpPane binding defers to the foreground app
# whenever it requests mouse tracking (mouse_any_flag) -- Claude Code's CLI
# does exactly that for its own UI, which is why scrolling was landing in
# its chat box instead of tmux's pane history. This override makes wheel-up
# always enter copy-mode (tmux's real scrollback) unconditionally, regardless
# of what the app wants. Once inside copy-mode, further wheel scroll (up or
# down) is handled by tmux's own copy-mode bindings already, so no PgUp/PgDn
# key is ever needed -- pure mouse-wheel scrolling works end to end.
bind-key -T root WheelUpPane copy-mode -e
